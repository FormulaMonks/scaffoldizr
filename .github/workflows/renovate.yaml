name: Renovate

on:
  schedule:
    # Weekly, Mondays at 05:00 UTC. This cron is the only cadence control:
    # .github/renovate.json deliberately sets no `schedule`, so Renovate does
    # all of its work whenever this workflow runs.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (no branches, PRs or merges)"
        type: choice
        default: "disabled"
        options:
          - disabled
          - extract
          - lookup
          - full
      log_level:
        description: "Renovate log level"
        type: choice
        default: "info"
        options:
          - info
          - debug

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.2.1
        with:
          # Repo config lives in .github/renovate.json and is auto-discovered
          # from the clone Renovate makes, so no checkout is needed here.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Empty value means "not a dry run" (Renovate ignores empty env vars).
          RENOVATE_DRY_RUN: ${{ inputs.dry_run != 'disabled' && inputs.dry_run || '' }}
